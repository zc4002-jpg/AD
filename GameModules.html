<style>
  .wm-game {
    --wm-accent: #2e6856;
    color: #243b35;
    font-size: 18px;
  }

  .wm-game * { box-sizing: border-box; }

  .wm-game__top,
  .wm-game__stats,
  .wm-game__actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .wm-game__top {
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid #d9e4df;
  }

  .wm-game__top h3 { margin: 0; font-size: 1.45rem; }

  .wm-game__stats {
    justify-content: center;
    margin-bottom: 18px;
  }

  .wm-game__stat {
    min-width: 130px;
    padding: 10px 14px;
    border-radius: 14px;
    background: #edf6f2;
    text-align: center;
    font-weight: 800;
  }

  .wm-game__stage {
    min-height: 360px;
    padding: 22px;
    border: 2px solid #d9e4df;
    border-radius: 20px;
    background: #fffdf8;
    text-align: center;
  }

  .wm-game__prompt {
    margin: 8px auto 20px;
    font-size: clamp(1.35rem, 3vw, 2rem);
    font-weight: 900;
    line-height: 1.45;
  }

  .wm-game__feedback {
    min-height: 32px;
    margin: 14px 0;
    color: #765018;
    font-weight: 800;
  }

  .wm-game__grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 14px;
    max-width: 760px;
    margin: 0 auto;
  }

  .wm-game button {
    min-height: 52px;
    border: 0;
    border-radius: 14px;
    padding: 11px 18px;
    background: var(--wm-accent);
    color: #fff;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  .wm-game button:hover { filter: brightness(.96); }
  .wm-game button:focus-visible { outline: 4px solid #f3bd50; outline-offset: 3px; }
  .wm-game button:disabled { cursor: default; opacity: .55; }

  .wm-game .wm-game__secondary { background: #667871; }
  .wm-game .wm-game__hint { background: #a86f18; }

  .wm-game__choice {
    min-height: 94px !important;
    background: #eef5ff !important;
    color: #20304d !important;
    border: 3px solid #7f9bc7 !important;
    font-size: 1.55rem !important;
  }

  .wm-game__choice.is-correct {
    background: #dff5e8 !important;
    border-color: #2e8b57 !important;
  }

  .wm-game__choice.is-wrong {
    background: #fff0ef !important;
    border-color: #c84b45 !important;
  }

  .wm-game__memory {
    grid-template-columns: repeat(var(--columns, 4), minmax(104px, 1fr));
    gap: 16px;
    max-width: 820px;
  }

  .wm-game__memory-card {
    aspect-ratio: 1;
    min-height: 112px !important;
    padding: 6px !important;
    background: #3e7563 !important;
    font-size: clamp(3.6rem, 8vw, 5.8rem) !important;
    line-height: 1 !important;
  }

  .wm-game__memory-card.is-open,
  .wm-game__memory-card.is-matched { background: #fff !important; }
  .wm-game__memory-card.is-matched { border: 4px solid #4c9f70; }

  .wm-game__puzzle {
    display: grid;
    grid-template-columns: repeat(var(--size, 3), 1fr);
    grid-template-rows: repeat(var(--size, 3), 1fr);
    gap: var(--puzzle-gap, 4px);
    width: min(720px, 100%);
    aspect-ratio: 4 / 3;
    margin: 0 auto;
    padding: 4px;
    border: 3px solid #315d50;
    border-radius: 14px;
    background: #315d50;
    overflow: hidden;
  }

  .wm-game__puzzle-piece {
    min-height: 0 !important;
    padding: 0 !important;
    border: var(--piece-border, 2px) solid #fff !important;
    border-radius: 4px !important;
    background-repeat: no-repeat !important;
    cursor: pointer;
  }

  .wm-game__puzzle-piece.is-selected {
    position: relative;
    z-index: 2;
    outline: 7px solid #f1b84b;
    outline-offset: -5px;
  }

  .wm-game__puzzle-preview {
    width: min(720px, 100%);
    aspect-ratio: 4 / 3;
    margin: 0 auto 14px;
    border: 4px solid #315d50;
    border-radius: 16px;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    box-shadow: 0 5px 16px rgba(35, 67, 57, .18);
  }

  .wm-game__puzzle-name {
    margin: 8px 0 16px;
    color: #315d50;
    font-size: 1.35rem;
    font-weight: 900;
  }

  .wm-game__preview {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 12px auto 18px;
    padding: 12px;
    border-radius: 14px;
    background: #f1eee5;
    font-size: clamp(2.6rem, 6vw, 4rem);
  }

  .wm-game__silhouette {
    margin: 14px 0 24px;
    color: #111;
    font-size: clamp(7rem, 21vw, 12rem);
    filter: grayscale(1) brightness(0);
  }

  .wm-game__products {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .wm-game__product {
    min-width: 165px;
    padding: 18px;
    border: 3px solid #5e85bd;
    border-radius: 16px;
    background: #fff;
    font-weight: 800;
    font-size: 1.15rem;
  }

  .wm-game__product span {
    display: block;
    margin-bottom: 8px;
    font-size: clamp(4rem, 9vw, 6rem);
    line-height: 1;
  }

  .wm-game__answer {
    width: min(320px, 100%);
    margin: 10px auto;
    padding: 14px;
    border: 3px solid #7b8f88;
    border-radius: 14px;
    font: inherit;
    font-size: 1.6rem;
    text-align: center;
  }

  .wm-game__dice {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin: 16px 0 24px;
    font-size: clamp(6.5rem, 17vw, 10rem);
    line-height: 1;
  }

  .wm-game__battle-board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 18px;
  }

  .wm-game__player {
    padding: 18px;
    border-radius: 18px;
    color: #fff;
  }

  .wm-game__player:first-child { background: #3569a9; }
  .wm-game__player:last-child { background: #3c8656; }
  .wm-game__player strong { display: block; font-size: 2.8rem; }

  .wm-game__number-target {
    width: min(560px, 100%);
    margin: 0 auto 18px;
    padding: 16px 20px;
    border: 3px solid #315d50;
    border-radius: 18px;
    background: #edf6f2;
    color: #214e40;
    font-size: clamp(1.35rem, 3.4vw, 2rem);
    font-weight: 900;
    line-height: 1.45;
  }

  .wm-game__number-target strong {
    display: inline-grid;
    min-width: 72px;
    min-height: 58px;
    margin-left: 8px;
    place-items: center;
    border: 4px solid var(--number-color, #315d50);
    border-style: var(--number-border-style, solid);
    border-radius: 13px;
    background: #fff;
    color: var(--number-color, #315d50);
    font-size: 2rem;
  }

  .wm-game__number-sequence {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .wm-game__number-sequence span {
    min-width: 58px;
    padding: 9px 12px;
    border: 3px solid var(--number-color, #315d50);
    border-style: var(--number-border-style, solid);
    border-radius: 12px;
    background: #fff;
    color: var(--number-color, #214e40);
    font-size: 1.65rem;
  }

  .wm-game__sequence-arrow {
    color: #315d50;
    font-size: 1.75rem;
    font-weight: 900;
  }

  .wm-game__number-board {
    display: grid;
    grid-template-columns: repeat(var(--columns, 4), minmax(56px, 1fr));
    gap: 10px;
    width: min(720px, 100%);
    margin: 0 auto;
  }

  .wm-game__number-cell {
    aspect-ratio: 1;
    min-height: 64px !important;
    padding: 4px !important;
    border: 4px solid var(--number-color, #315d50) !important;
    border-style: var(--number-border-style, solid) !important;
    background: #fff !important;
    color: var(--number-color, #315d50) !important;
    font-size: clamp(1.55rem, 4vw, 2.35rem) !important;
    line-height: 1 !important;
  }

  .wm-game__number-cell.is-found {
    border-color: #2e8b57 !important;
    border-style: solid !important;
    background: #dff5e8 !important;
    color: #1f6840 !important;
  }

  .wm-game__number-cell.is-wrong {
    border-color: #c84b45 !important;
    border-style: solid !important;
    background: #fff0ef !important;
    color: #9b302c !important;
  }

  @media (max-width: 620px) {
    .wm-game__stage { padding: 14px; }
    .wm-game__memory {
      grid-template-columns: repeat(var(--columns, 3), minmax(76px, 1fr));
      gap: 10px;
    }
    .wm-game__memory-card {
      min-height: 88px !important;
      font-size: clamp(3rem, 13vw, 4.8rem) !important;
    }
    .wm-game__number-board {
      gap: 6px;
      grid-template-columns: repeat(var(--columns, 4), minmax(42px, 1fr));
    }
    .wm-game__number-cell {
      min-height: 48px !important;
      border-width: 3px !important;
      font-size: clamp(1.25rem, 6vw, 1.9rem) !important;
    }
    .wm-game__battle-board { grid-template-columns: 1fr; }
  }
  .wm-game__placement-toolbar {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 8px 18px;
    align-items: center;
    text-align: left;
    margin-bottom: 16px;
  }
  .wm-game__placement-toolbar .wm-game__prompt {
    margin: 0;
    font-size: 1.4rem;
  }
  .wm-game__placement-card {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    min-height: 154px;
    width: min(260px, 100%);
    grid-row: 1 / 4;
    grid-column: 1;
    margin: 0;
    border: 4px solid #705091;
    border-radius: 20px;
    background: #f5effb;
    color: #50366c;
    font-weight: 800;
  }
  .wm-game__placement-card strong {
    font-size: clamp(3.2rem, 7vw, 4.6rem);
    line-height: 1.1;
  }
  .wm-game__placement-card.is-placed {
    border-color: #2e6856;
    background: #e5f4ec;
    color: #234e3b;
  }
  .wm-game__placement-actions {
    justify-content: flex-start;
    margin: 0;
  }
  .wm-game__placement-scroll {
    /* 完整展開所有排，垂直方向由整頁捲動，避免平板把最後一排藏在內層捲軸。 */
    overflow-x: auto;
    height: auto;
    max-height: none;
    padding: 6px;
    border: 2px solid #c5b49f;
    border-radius: 18px;
    background: #ece1d0;
    max-width: 850px;
    margin: 0 auto;
  }
  .wm-game__placement-board {
    display: grid;
    grid-auto-rows: minmax(68px, auto);
    grid-template-columns: repeat(var(--columns, 10), minmax(60px, 1fr));
    gap: 6px;
  }
  .wm-game__placement-cell {
    min-height: 68px !important;
    padding: 5px 2px !important;
    background: #fffdf8 !important;
    color: #493a2d !important;
    border: 2px solid #b7a389 !important;
    border-radius: 10px !important;
    font-size: 1.8rem !important;
    line-height: 1.15 !important;
    font-variant-numeric: tabular-nums;
  }
  .wm-game__placement-cell:disabled { opacity: 1 !important; }
  .wm-game__placement-cell.is-filled {
    background: #e5f4ec !important;
    border: 3px solid #2e6856 !important;
    color: #234e3b !important;
    box-shadow: inset 0 -5px 0 #b8d9c5;
  }
  .wm-game__placement-cell small {
    display: block;
    margin-top: 3px;
    font-size: .68rem;
    line-height: 1.1;
  }
  .wm-game__placement-cell.is-hint-row {
    border-color: #a46a12 !important;
    background: #fff0c9 !important;
  }
  .wm-game__placement-cell.is-wrong {
    border-color: #b9443d !important;
    background: #ffede9 !important;
  }
  .wm-game__placement-help {
    margin: 10px auto;
    font-size: 1rem;
    color: #5d5146;
  }
  .wm-game__placement-feedback {
    min-height: 36px;
    font-size: 1.15rem;
    margin: 0;
  }
  @media (max-width: 620px) {
    .wm-game__placement-toolbar { grid-template-columns: 110px minmax(0, 1fr); gap: 8px 10px; }
    .wm-game__placement-toolbar .wm-game__prompt { font-size: 1.15rem; }
    .wm-game__placement-card { min-height: 140px; padding: 4px; font-size: .95rem; }
    .wm-game__placement-card strong { font-size: 3.2rem; }
    .wm-game__placement-actions { grid-column: 1 / -1; }
    .wm-game__placement-feedback { font-size: 1rem; }
    .wm-game__placement-board {
      grid-template-columns: repeat(var(--columns, 10), minmax(52px, 1fr));
      grid-auto-rows: minmax(60px, auto);
      gap: 5px;
    }
    .wm-game__placement-cell { min-height: 60px !important; font-size: 1.5rem !important; }
  }

  .wm-tea .wm-game__stage { padding: 16px; min-height: 0; }
  .wm-tea__intro { max-width: 800px; margin: auto; text-align: left; }
  .wm-tea__intro h4 { margin: 12px 0; font-size: 1.65rem; }
  .wm-tea__intro p { font-size: 1.2rem; line-height: 1.65; }
  .wm-tea__notice { padding: 14px 18px; border-radius: 16px; background: #edf6f2; }
  .wm-tea__modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 18px 0; }
  .wm-tea__modes button { min-height: 76px; font-size: 1.25rem; }
  .wm-tea__status { padding: 14px; min-height: 76px; background: #fff1d4; border: 2px solid #c98c22; border-radius: 14px; line-height: 1.6; }
  .wm-tea__status.is-ready { background: #e5f4ec; border-color: #2e6856; }
  .wm-tea__board { position: relative; width: min(900px, 100%); margin: 12px auto; border: 3px solid #b9ccbe; border-radius: 20px; overflow: hidden; background: #faf5e8; }
  .wm-tea__board svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wm-tea__board text { font-family: inherit; font-weight: 800; }
  .wm-tea__overlay { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 20px; background: rgba(255, 253, 248, .96); font-size: 1.55rem; font-weight: 800; }
  .wm-tea__overlay p { margin: 0; }
  .wm-tea__overlay button { margin: 0 auto; min-width: 200px; }
  .wm-tea__progress { max-width: 680px; margin: 12px auto; height: 22px; border-radius: 12px; border: 2px solid #c7bda7; background: #fff; overflow: hidden; }
  .wm-tea__progress-fill { width: 0%; height: 100%; background: #2e6856; }
  .wm-tea__instruction { margin: 10px auto; font-size: clamp(1.15rem, 2.5vw, 1.55rem); font-weight: 800; }
  .wm-tea__feedback { min-height: 38px; margin: 10px 0; color: #765018; font-size: 1.15rem; font-weight: 800; }
  .wm-tea__actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 14px 0 4px; }
  .wm-tea__footnote { margin: 14px 0 0; color: #53675d; font-size: 1rem; line-height: 1.55; }
  .wm-tea__round { padding: 25px 10px; }
  .wm-tea__round h4 { margin: 0 0 12px; font-size: 2rem; }
  .wm-tea__round p { font-size: 1.35rem; }
  @media (max-width: 620px) {
    .wm-tea .wm-game__stage { padding: 10px; }
    .wm-tea__modes { grid-template-columns: 1fr; }
    .wm-tea__board { border-radius: 14px; }
    .wm-tea__actions button { flex: 1 1 140px; }
    .wm-tea__overlay { font-size: 1.2rem; padding: 12px; }
    .wm-tea__intro p { font-size: 1.1rem; }
  }

  .wm-drums .wm-game__stage { min-height: 0; padding: 16px; }
  .wm-drums__intro { max-width: 780px; margin: auto; text-align: left; }
  .wm-drums__intro p { font-size: 1.2rem; line-height: 1.65; }
  .wm-drums__notice { padding: 14px 18px; border-radius: 16px; background: #edf6f2; }
  .wm-drums__modes, .wm-drums__pads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 18px auto; }
  .wm-drums__modes button { min-height: 76px; font-size: 1.2rem; }
  .wm-drums__pads { max-width: 900px; gap: clamp(14px, 3vw, 36px); }
  .wm-drums__pad { width: 100%; min-height: 190px !important; aspect-ratio: 1.2; max-height: 320px; border-radius: 35% !important; border: 7px solid #678279 !important; background: #f4faf7 !important; color: #24493c !important; box-shadow: inset 0 -12px 0 #d5e5dc; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px !important; }
  .wm-drums__pad.is-right { border-color: #b07a40 !important; background: #fff8ee !important; color: #765018 !important; box-shadow: inset 0 -12px 0 #ead7b8; }
  .wm-drums__pad.is-target { border-color: #2e6856 !important; background: #d9f1e4 !important; box-shadow: inset 0 -12px 0 #a8d6bb, 0 0 0 4px #fff; }
  .wm-drums__pad.is-right.is-target { border-color: #96580e !important; background: #ffe5b2 !important; box-shadow: inset 0 -12px 0 #e9bc72, 0 0 0 4px #fff; }
  .wm-drums__pad.is-held { box-shadow: inset 0 5px 0 #b9ccb8; }
  .wm-drums__pad:disabled { opacity: .7 !important; cursor: default; }
  .wm-drums__hand { font-size: clamp(42px, 7vw, 70px); line-height: 1; }
  .wm-drums__label { font-size: clamp(30px, 5vw, 54px); font-weight: 900; line-height: 1.15; }
  .wm-drums__pad small { font-size: clamp(18px, 2.8vw, 25px); font-weight: 700; }
  .wm-drums__prompt { font-size: clamp(26px, 4.5vw, 38px); font-weight: 900; margin: 16px 0 8px; }
  .wm-drums__sequence { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .wm-drums__step { padding: 10px 18px; border: 3px solid #d1ddcf; border-radius: 14px; background: #fff; font-size: 1.15rem; font-weight: 800; }
  .wm-drums__step.is-current { border-color: #2e6856; background: #e4f4eb; }
  .wm-drums__step.is-done { color: #466750; background: #f0f6ed; }
  .wm-drums__feedback { min-height: 55px; font-size: 1.25rem; font-weight: 800; line-height: 1.55; color: #765018; }
  .wm-drums__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .wm-drums__footnote { font-size: 1rem; line-height: 1.55; color: #53675d; }
  @media (max-width: 620px) {
    .wm-drums .wm-game__stage { padding: 10px; }
    .wm-drums__modes { grid-template-columns: 1fr; }
    .wm-drums__pads { gap: 12px; }
    .wm-drums__pad { min-height: 160px !important; padding: 10px !important; }
    .wm-drums__actions button { flex: 1 1 140px; }
    .wm-drums__step { padding: 8px 12px; }
  }

/* 大圖案及清楚邊框；已翻開卡片不套用停用按鈕的淡化效果 */
.wm-game__memory { max-width: 1000px; grid-template-columns: repeat(var(--columns, 4), minmax(0, 1fr)); gap: 10px; }
.wm-game__memory-card { container-type: inline-size; min-height: 0 !important; border: 3px solid #214e40 !important; padding: 2px !important; display: grid; place-items: center; }
.wm-game__memory-card span { font-size: clamp(3rem, 9vw, 8rem); font-size: 76cqi; line-height: 1.1; }
.wm-game__memory-card:disabled { opacity: 1; }
.wm-game__memory-card.is-matched { background: #e7f6dd !important; border: 5px solid #276634 !important; }
.wm-game__silhouette { width: 100%; margin: 12px auto; font-size: clamp(10rem, 27vw, 18rem); line-height: 1.15; }
@media (max-width: 620px) {
  .wm-game__memory { grid-template-columns: repeat(var(--columns, 3), minmax(0, 1fr)); gap: 6px; }
}

/* 2026-10-14 cooperative shell: same tablet, landscape and portrait. */
#gamePlayView .wm-game { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:18px; align-items:start; }
.wm-game__main { min-width:0; position:relative; }
.wm-game__body { min-width:0; }
.wm-game__top { justify-content:flex-end; margin-bottom:12px; border:0; padding:0; }
.wm-game__top h3 { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
.wm-game__progress { padding:9px 16px; border-radius:14px; background:#e2eee6; color:#214e40; font-size:22px; font-weight:800; }
.wm-game__tools { padding:18px; background:#e8f0e8; border:1px solid #a9bdae; border-radius:18px; min-width:0; }
.wm-game__tools h3 { font-size:22px; margin:0 0 16px; }
.wm-game__tool-buttons { display:grid; gap:12px; }
.wm-game__tools .wm-game__tool { width:100%; min-height:64px; font-size:20px; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px; }
.wm-game__tool-symbol { font-size:27px; line-height:1; }
.wm-game__tools .wm-game__tool-end { border:2px solid #214e40; background:#fffdf8; color:#214e40; }
.wm-game__tools small { display:block; font-size:16px; color:#405b4f; margin:10px 0 14px; line-height:1.5; }

  .wm-game__progress { font-size:18px; }
}

</style>

<script>
(function () {
  'use strict';

  const modules = {};
  let activeSession = null;


  function armTimeout(token) {
    if (token.session.paused || token.native !== null || !token.session.timers.has(token)) return;
    token.due = Date.now() + token.remaining;
    token.native = window.setTimeout(function () {
      token.session.timers.delete(token);
      token.native = null;
      if (activeSession === token.session && !token.session.paused) token.callback();
    }, token.remaining);
  }
  function sessionTimeout(callback, delay) {
    if (!activeSession) return window.setTimeout(callback, delay);
    const token = { warmTimer:true, session:activeSession, callback:callback, remaining:Math.max(0,Number(delay)||0), native:null };
    activeSession.timers.add(token); armTimeout(token); return token;
  }
  function clearSessionTimeout(token) {
    if (!token || !token.warmTimer) { window.clearTimeout(token); return; }
    window.clearTimeout(token.native); token.session.timers.delete(token); token.native=null;
  }
  function armFrame(token) {
    if (token.session.paused || token.native !== null || !token.session.frames.has(token)) return;
    token.native = window.requestAnimationFrame(function (time) {
      token.session.frames.delete(token); token.native=null;
      if (activeSession===token.session && !token.session.paused) token.callback(time);
    });
  }
  function sessionFrame(callback) {
    if (!activeSession) return window.requestAnimationFrame(callback);
    const token={ warmFrame:true, session:activeSession, callback:callback, native:null };
    activeSession.frames.add(token); armFrame(token); return token;
  }
  function clearSessionFrame(token) {
    if (!token || !token.warmFrame) { window.cancelAnimationFrame(token); return; }
    window.cancelAnimationFrame(token.native); token.session.frames.delete(token); token.native=null;
  }
  function disposeSession(session) {
    if (session.destroy) session.destroy();
    Array.from(session.timers).forEach(clearSessionTimeout);
    Array.from(session.frames).forEach(clearSessionFrame);
    if (session.observer) session.observer.disconnect();
    if (session.onHidden) document.removeEventListener('visibilitychange',session.onHidden);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }
  function setSessionPaused(paused) {
    const session=activeSession;
    if (!session || session.paused===paused) return;
    session.paused=paused;
    if (paused) {
      session.pauseStarted=Date.now(); session.pauseCount+=1;
      if (session.instance && session.instance.onFacilitatorPause) session.instance.onFacilitatorPause();
      session.timers.forEach(function(token) { if(token.native!==null){token.remaining=Math.max(0,token.due-Date.now());window.clearTimeout(token.native);token.native=null;} });
      session.frames.forEach(function(token) { window.cancelAnimationFrame(token.native); token.native=null; });
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    } else {
      session.pausedMs+=Date.now()-session.pauseStarted;
      if (session.instance && session.instance.onFacilitatorResume) session.instance.onFacilitatorResume();
      session.timers.forEach(armTimeout); session.frames.forEach(armFrame);
    }
    const shell=session.shell;
    if (shell) {
      shell.body.inert=paused;
      if (paused) shell.body.setAttribute('aria-hidden','true'); else shell.body.removeAttribute('aria-hidden');
      shell.pauseOverlay.hidden=!paused;
      shell.pauseButton.textContent=paused?'▶ 繼續活動':'Ⅱ 休息一下';
      shell.pauseButton.setAttribute('aria-pressed',String(paused));
      shell.live.textContent=paused?'休息一下，已完成進度會保留。':'已繼續活動。';
      if (paused) shell.resumeButton.focus({preventScroll:true}); else shell.pauseButton.focus({preventScroll:true});
    }
  }
  function requestSessionEnd() {
    if (!activeSession) return;
    const session=activeSession, wasPaused=session.paused;
    setSessionPaused(true);
    const finish=function () { if (activeSession===session) abandonSession(); };
    const keep=function () { if (activeSession===session && !wasPaused) setSessionPaused(false); };
    if (window.confirmActivityAction) {
      window.confirmActivityAction('結束本次活動？','已完成的題數與進度會保留，接著填寫活動紀錄。','結束並填寫紀錄',finish,keep);
    } else if (window.confirm('結束本次活動並保留目前進度？')) finish(); else keep();
  }
  function readSessionPrompt() {
    const session=activeSession;
    if (!session || !session.shell) return;
    if (session.paused) { speak('目前休息中，準備好再按繼續活動。'); return; }
    const original=Array.from(session.shell.body.querySelectorAll('button')).find(function(button) {
      return !button.disabled && /^(語音提示|朗讀.*|讀出.*)$/.test(button.textContent.trim());
    });
    if (original) { original.click(); return; }
    const prompt=session.shell.stage.querySelector('.wm-game__prompt');
    speak(prompt ? prompt.textContent : '請依畫面提示進行，夥伴可先示範，再讓長輩操作。');
  }

  function shuffle(items) {
    const copy = items.slice();

    for (let index = copy.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
    }

    return copy;
  }

  function drawWithoutRepeat(items, count, bankKey, context, getId, recentLimit) {
    const wanted = Math.min(count, items.length);
    const identify = getId || function (item) { return String(item); };
    const identity = String(
      context && (context.clientId || context.deviceId)
        ? (context.clientId || context.deviceId)
        : 'device'
    );
    const storageKey =
      'warm-memory-bank-v2:' + bankKey + ':' + encodeURIComponent(identity);
    const validIds = new Set(items.map(function (item) {
      return String(identify(item));
    }));
    let history = { cycle: [], recent: [] };

    try {
      const saved = JSON.parse(window.localStorage.getItem(storageKey) || '{}');
      if (Array.isArray(saved.cycle)) history.cycle = saved.cycle;
      if (Array.isArray(saved.recent)) history.recent = saved.recent;
    } catch (error) {
      history = { cycle: [], recent: [] };
    }

    history.cycle = history.cycle.filter(function (id, index, list) {
      return validIds.has(String(id)) && list.indexOf(id) === index;
    });
    history.recent = history.recent.filter(function (id) {
      return validIds.has(String(id));
    });

    const used = new Set(history.cycle.map(String));
    const available = items.filter(function (item) {
      return !used.has(String(identify(item)));
    });
    let selected = shuffle(available).slice(0, wanted);
    let nextCycle = history.cycle.concat(selected.map(function (item) {
      return String(identify(item));
    }));

    if (selected.length < wanted) {
      const needed = wanted - selected.length;
      const selectedIds = selected.map(function (item) {
        return String(identify(item));
      });
      const blockCount = Math.max(recentLimit || wanted * 2, wanted);
      const recentBlock = history.recent
        .concat(selectedIds)
        .slice(-blockCount);
      const blocked = new Set(recentBlock.map(String));
      let rolloverPool = items.filter(function (item) {
        return !blocked.has(String(identify(item)));
      });

      if (rolloverPool.length < needed) {
        const selectedSet = new Set(selectedIds);
        rolloverPool = items.filter(function (item) {
          return !selectedSet.has(String(identify(item)));
        });
      }

      const rollover = shuffle(rolloverPool).slice(0, needed);
      selected = selected.concat(rollover);
      nextCycle = rollover.map(function (item) {
        return String(identify(item));
      });
    }

    const selectedIds = selected.map(function (item) {
      return String(identify(item));
    });
    const nextHistory = {
      cycle: nextCycle,
      recent: history.recent
        .concat(selectedIds)
        .slice(-Math.max(recentLimit || wanted * 2, wanted))
    };

    try {
      window.localStorage.setItem(storageKey, JSON.stringify(nextHistory));
    } catch (error) {
      // 裝置禁止儲存時仍可正常遊玩，只是不保留跨次題庫紀錄。
    }

    return selected;
  }

  function levelKey(level) {
    return level === '進階' ? 'hard' : level === '標準' ? 'medium' : 'easy';
  }


  function makeButton(label, className, onClick) {
    const button=document.createElement('button');
    button.type='button'; button.textContent=label;
    if (className) button.className=className;
    button.addEventListener('click',function(event) {
      const session=activeSession;
      if (session && session.paused && session.shell && session.shell.body.contains(button)) return;
      const hadFocus=document.activeElement===button;
      const group=className ? className.split(' ')[0] : '';
      const before=session && session.shell ? Array.from(session.shell.body.querySelectorAll('button')).filter(function(x){return !group || x.classList.contains(group);}) : [];
      const index=before.indexOf(button);
      onClick(event);
      if (hadFocus && session && activeSession===session && !button.isConnected && session.shell) {
        const after=Array.from(session.shell.body.querySelectorAll('button')).filter(function(x){return !x.disabled && !x.hidden && (!group || x.classList.contains(group));});
        const next=after[Math.min(Math.max(index,0),after.length-1)] || session.shell.pauseButton;
        if (next) next.focus({preventScroll:true});
      }
    });
    return button;
  }
  function createShell(container,title,context,handlers) {
    container.textContent='';
    const session=activeSession;
    const root=document.createElement('div'); root.className='wm-game';
    const main=document.createElement('div'); main.className='wm-game__main';
    const body=document.createElement('div'); body.className='wm-game__body';
    const top=document.createElement('div'); top.className='wm-game__top';
    const heading=document.createElement('h3'); heading.textContent=title;
    const progress=document.createElement('div'); progress.className='wm-game__progress';
    top.appendChild(heading); top.appendChild(progress);
    const stats=document.createElement('div'); stats.className='wm-game__stats';
    const stage=document.createElement('div'); stage.className='wm-game__stage';
    body.appendChild(top); body.appendChild(stage); main.appendChild(body);
    const tools=document.createElement('aside'); tools.className='wm-game__tools'; tools.setAttribute('aria-label','帶領者操作');
    const toolsTitle=document.createElement('h3'); toolsTitle.textContent='帶領者操作'; tools.appendChild(toolsTitle);
    const controls=document.createElement('div'); controls.className='wm-game__tool-buttons';
    const readButton=makeButton('◖ 朗讀提示','wm-game__tool',readSessionPrompt);
    const pauseButton=makeButton('Ⅱ 休息一下','wm-game__tool',function(){setSessionPaused(!activeSession.paused);});
    pauseButton.setAttribute('aria-pressed','false');
    const exitButton=makeButton('⇥ 結束活動','wm-game__tool wm-game__tool-end',handlers.cancel);
    controls.appendChild(readButton); controls.appendChild(pauseButton); controls.appendChild(exitButton); tools.appendChild(controls);
    const note=document.createElement('small'); note.textContent='結束時保留已完成進度；活動後由夥伴填寫觀察。'; tools.appendChild(note);
    const tips=document.createElement('details'), tipTitle=document.createElement('summary'), tipText=document.createElement('p');
    tipTitle.textContent='帶領小提醒'; tipText.textContent=context.guidance || '先示範一題，給長輩足夠時間；需要時再提示，也可休息。';
    tips.appendChild(tipTitle); tips.appendChild(tipText); tools.appendChild(tips);
    const information=document.createElement('details'), informationTitle=document.createElement('summary');
    informationTitle.textContent='活動進度詳情'; information.appendChild(informationTitle); information.appendChild(stats); tools.appendChild(information);
    const live=document.createElement('div'); live.className='wm-game__sr-only'; live.setAttribute('role','status'); live.setAttribute('aria-live','polite'); live.setAttribute('aria-atomic','true');
    tools.appendChild(live);
    const pauseOverlay=document.createElement('div'); pauseOverlay.className='wm-game__pause-overlay'; pauseOverlay.hidden=true;
    const pauseTitle=document.createElement('strong'); pauseTitle.textContent='休息一下';
    const pauseText=document.createElement('p'); pauseText.textContent='已完成進度會保留，準備好再繼續。';
    const resumeButton=makeButton('繼續活動','',function(){setSessionPaused(false);});
    pauseOverlay.appendChild(pauseTitle); pauseOverlay.appendChild(pauseText); pauseOverlay.appendChild(resumeButton); main.appendChild(pauseOverlay);
    root.appendChild(main); root.appendChild(tools); container.appendChild(root);
    session.shell={root:root,body:body,stage:stage,pauseOverlay:pauseOverlay,pauseButton:pauseButton,resumeButton:resumeButton,live:live};
    ['click','keydown','pointerdown','pointermove','touchstart'].forEach(function(type){body.addEventListener(type,function(event){if(session.paused){event.preventDefault();event.stopImmediatePropagation();}},true);});
    let previousMessage='';
    session.observer=new MutationObserver(function(){
      Array.from(body.querySelectorAll('button')).forEach(function(button){
        const text=button.textContent.trim();
        if (/^(語音提示|朗讀.*|讀出.*|休息一下)$/.test(text) && !button.hidden) button.hidden=true;
      });
      const feedback=stage.querySelector('.wm-game__feedback,.wm-game__placement-feedback,.wm-tea__feedback,.wm-drums__feedback');
      if (feedback && feedback.textContent!==previousMessage && !session.paused) {previousMessage=feedback.textContent;live.textContent=previousMessage;}
    });
    session.observer.observe(body,{childList:true,subtree:true,characterData:true});
    session.onHidden=function(){if(document.hidden && activeSession===session)setSessionPaused(true);};
    document.addEventListener('visibilitychange',session.onHidden);
    return {root:root,stats:stats,stage:stage,setStats:function(items){
      progress.textContent=items.find(function(item){return /輪|題目：|關卡：|已出題：|尚未開始|練習/.test(item);}) || items[0] || '';
      stats.textContent=''; items.forEach(function(item){const stat=document.createElement('div');stat.className='wm-game__stat';stat.textContent=item;stats.appendChild(stat);});
    },feedback:function(message){const box=stage.querySelector('.wm-game__feedback');if(box)box.textContent=message;}};
  }
  function speak(text) {
    if (!text) return;
    if (!('speechSynthesis' in window)) {
      if (activeSession && activeSession.shell) activeSession.shell.live.textContent='此瀏覽器不支援語音，可由夥伴朗讀提示。';
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-TW';
    utterance.rate = 0.82;
    window.speechSynthesis.speak(utterance);
  }

  function finishSession(result) {
    if (!activeSession) return;

    const session = activeSession;
    const elapsed = Math.max(
      1,
      Math.round((Date.now() - session.startedAt) / 1000)
    );

    const finalResult = Object.assign({
      gameId: session.context.gameId,
      moduleKey: session.context.moduleKey,
      version: session.context.version || '1.0.0',
      level: session.context.level,
      score: 0,
      completion: 100,
      durationSeconds: elapsed,
      correctCount: 0,
      wrongCount: 0,
      hintCount: 0,
      completed: true,
      details: {}
    }, result || {});
    finalResult.details=Object.assign({},finalResult.details||{},{facilitatorPauseCount:session.pauseCount,facilitatorPausedSeconds:Math.round((session.pausedMs+(session.paused?Date.now()-session.pauseStarted:0))/1000)});

    disposeSession(session);
    activeSession = null;
    session.handlers.complete(finalResult);
  }

  function cancelSession() {
    if (!activeSession) return;
    const session = activeSession;
    disposeSession(session);
    activeSession = null;
    session.handlers.cancel();
  }

  function abandonSession() {
    if (!activeSession) return;

    const progress = activeSession.getProgress
      ? activeSession.getProgress()
      : {};
    const details = Object.assign({}, progress.details || {}, {
      abandoned: true,
      status: '中途放棄'
    });

    finishSession(Object.assign({}, progress, {
      completed: false,
      details: details
    }));
  }

  function register(key, factory) {
    modules[key] = factory;
  }

  function start(key, container, context, handlers) {
    if (activeSession) cancelSession();
    if (!modules[key]) throw new Error('找不到遊戲模組：' + key);

    activeSession = {
      context: context,
      handlers: handlers,
      startedAt: Date.now(),
      destroy: null,
      getProgress: null, instance:null, paused:false, pauseCount:0, pauseStarted:0, pausedMs:0, timers:new Set(), frames:new Set()
    };

    const host = {
      complete: finishSession,
      cancel: requestSessionEnd,
      speak: speak,
      shuffle: shuffle,
      levelKey: levelKey,
      makeButton: makeButton,
      createShell: createShell
    };

    try {
      const instance = modules[key](container, context, host) || {};
      activeSession.instance = instance;
      activeSession.destroy = instance.destroy || null;
      activeSession.getProgress = instance.getProgress || null;
    } catch (error) {
      disposeSession(activeSession);
      activeSession = null;
      throw error;
    }
  }

  register('memory', function (container, context, host) {
    const pairsByLevel = { easy: 3, medium: 4, hard: 6 };
    const pairCount = pairsByLevel[host.levelKey(context.level)];
    const totalRounds = 3;
    const iconBank = [].concat(
      ['🍎', '🍌', '🍊', '🍇', '🍉', '🍓', '🍐', '🍑', '🍍', '🥝'],
      ['🥕', '🌽', '🍅', '🍆', '🥦', '🥬', '🍠', '🥔', '🥒', '🍄'],
      ['🐶', '🐱', '🐰', '🐢', '🐟', '🐦', '🦆', '🐴', '🐑', '🐘'],
      ['🚗', '🚌', '🚲', '🚂', '🚕', '🚑', '🚒', '🛵', '🚚', '✈️'],
      ['☎️', '📻', '⏰', '🔑', '👓', '🧹', '🪑', '☂️', '🛏️', '💡'],
      ['👒', '🧢', '👕', '👖', '👗', '🧦', '👞', '👢', '👜', '🎒'],
      ['☀️', '🌙', '⭐', '☁️', '🌈', '🌳', '🌵', '🌻', '🌷', '🍁'],
      ['⚽', '🏀', '⚾', '🎾', '🏓', '🎳', '🎸', '🎻', '🥁', '🎤'],
      ['🏠', '🏫', '🏥', '🏦', '⛪', '🏭', '⛺', '🎁', '🎈', '📷']
    );
    const sessionIcons = drawWithoutRepeat(
      iconBank,
      pairCount * totalRounds,
      'memory',
      context,
      function (icon) { return icon; },
      24
    );
    let cards = [];
    let first = null;
    let locked = false;
    let matches = 0;
    let roundWrong = 0;
    let totalMatches = 0;
    let totalWrong = 0;
    let currentRound = 0;
    let statusText = '';
    let awaitingNext = false;
    const roundResults = [];
    let timer = null;
    const ui = host.createShell(container, '生活圖卡配對', context, { cancel: host.cancel });

    function prepareRound() {
      const start = currentRound * pairCount;
      const icons = sessionIcons.slice(start, start + pairCount);
      cards = host.shuffle(icons.concat(icons)).map(function (icon, index) {
        return { id: index, icon: icon, open: false, matched: false };
      });
      first = null;
      locked = false;
      matches = 0;
      roundWrong = 0;
      awaitingNext = false;
      statusText = '第 ' + (currentRound + 1) + ' 輪開始';
      render();
    }

    function render() {
      ui.setStats([
        '第 ' + (currentRound + 1) + '／' + totalRounds + ' 輪',
        '已配對：' + matches + '／' + pairCount,
        '累計嘗試：' + (totalMatches + totalWrong)
      ]);
      ui.stage.textContent = '';

      const prompt = document.createElement('div');
      prompt.className = 'wm-game__prompt';
      prompt.textContent = '找出兩張相同的圖卡，共進行三輪';

      const grid = document.createElement('div');
      grid.className = 'wm-game__grid wm-game__memory';
      grid.style.setProperty('--columns', pairCount > 4 ? 4 : pairCount);

      cards.forEach(function (card) {
        const button = host.makeButton(card.open || card.matched ? card.icon : '？', 'wm-game__memory-card', function () {
          flip(card);
        });
        const picture = document.createElement('span');
        picture.textContent = button.textContent;
        button.textContent = '';
        button.appendChild(picture);
        if (card.open) button.classList.add('is-open');
        if (card.matched) button.classList.add('is-matched');
        button.setAttribute('aria-label','第'+(card.id+1)+'張'+(card.open||card.matched?'圖卡 '+card.icon:'未翻開圖卡')+(card.matched?'，已配對':''));
        button.disabled = locked || card.open || card.matched;
        grid.appendChild(button);
      });

      const feedback = document.createElement('div');
      feedback.className = 'wm-game__feedback';
      feedback.textContent = statusText;
      ui.stage.appendChild(prompt);
      ui.stage.appendChild(grid);
      ui.stage.appendChild(feedback);

      if (awaitingNext) {
        const actions = document.createElement('div');
        actions.className = 'wm-game__actions';
        actions.appendChild(host.makeButton(
          currentRound < totalRounds - 1 ? '前往下一輪' : '完成遊戲',
          '',
          advanceRound
        ));
        ui.stage.appendChild(actions);
      }
    }

    function finishGame() {
      host.complete({
        score: Math.round(
          totalMatches /
          Math.max(1, totalMatches + totalWrong) *
          100
        ),
        correctCount: totalMatches,
        wrongCount: totalWrong,
        details: {
          rounds: totalRounds,
          pairsPerRound: pairCount,
          bankSize: iconBank.length,
          totalPairs: totalMatches,
          attempts: totalMatches + totalWrong,
          roundResults: roundResults
        }
      });
    }

    function advanceRound() {
      if (!awaitingNext) return;
      if (currentRound < totalRounds - 1) {
        currentRound += 1;
        prepareRound();
        return;
      }
      finishGame();
    }

    function flip(card) {
      if (locked || card.open || card.matched) return;
      card.open = true;

      if (!first) {
        first = card;
        statusText = '再找一張相同的圖卡';
        render();
        return;
      }

      if (first.icon === card.icon) {
        first.matched = true;
        card.matched = true;
        matches += 1;
        totalMatches += 1;
        first = null;
        statusText = '配對成功！';
        render();

        if (matches === pairCount) {
          locked = true;
          awaitingNext = true;
          statusText = '第 ' + (currentRound + 1) + ' 輪完成！';
          roundResults.push({
            round: currentRound + 1,
            pairs: pairCount,
            wrong: roundWrong,
            attempts: pairCount + roundWrong
          });
          render();
        }
        return;
      }

      roundWrong += 1;
      totalWrong += 1;
      locked = true;
      statusText = '這兩張不一樣，再試一次';
      render();
      timer = sessionTimeout(function () {
        first.open = false;
        card.open = false;
        first = null;
        locked = false;
        statusText = '繼續找出相同的圖卡';
        render();
      }, 900);
    }

    prepareRound();
    return {
      destroy: function () { if (timer) clearSessionTimeout(timer); },
      getProgress: function () {
        return {
          score: Math.round(totalMatches / Math.max(1, totalMatches + totalWrong) * 100),
          completion: Math.round((currentRound + matches / pairCount) / totalRounds * 100),
          correctCount: totalMatches,
          wrongCount: totalWrong,
          details: {
            completedRounds: roundResults.length,
            currentRound: currentRound + 1,
            matchedPairsInCurrentRound: matches,
            pairsPerRound: pairCount,
            roundResults: roundResults
          }
        };
      }
    };
  });

    function choose(items, count, key, identify) {
      return drawWithoutRepeat(
        items,
        count,
        'number-search-' + level + '-' + key,
        context,
        identify,
        Math.max(count * 3, 12)
      );
    }

    function chooseDistinctNumberCells(items, count, key) {
      const candidates = choose(
        items,
        Math.min(items.length, Math.max(count * 4, count)),
        key,
        function (cell) { return cell.number + ':' + cell.color.key; }
      );
      const selected = [];
      const usedNumbers = new Set();

      candidates.concat(host.shuffle(items)).forEach(function (cell) {
        if (selected.length >= count || usedNumbers.has(cell.number)) return;
        usedNumbers.add(cell.number);
        selected.push(cell);
      });

      return selected;
    }

    function makeColorPairCells(numbers) {
      const cells = [];

      numbers.forEach(function (number) {
        const pairColors = host.shuffle(colors).slice(0, 2);
        pairColors.forEach(function (color, colorIndex) {
          cells.push(makeCell(number, color, colorIndex));
        });
      });

      return cells;
    }

    function buildEasyRound() {
      if (round === 2) {
        const colorCells = makeColorPairCells(range(8));
        grid = host.shuffle(colorCells);
        tasks = chooseDistinctNumberCells(
          colorCells,
          targetsPerRound,
          'easy-color-round'
        ).map(function (cell) {
          return {
            number: cell.number,
            color: cell.color,
            useColor: true,
            wrongCount: 0,
            hinted: false
          };
        });
        return;
      }

      grid = host.shuffle(range(16).map(function (number, index) {
        return makeCell(number, plainColor, index);
      }));

      tasks = choose(
        grid,
        targetsPerRound,
        'easy-round-' + round,
        function (cell) { return cell.number; }
      ).map(function (cell) {
        return {
          number: cell.number,
          color: plainColor,
          useColor: false,
          wrongCount: 0,
          hinted: false
        };
      });
    }

    function buildStandardNumberRound() {
      grid = host.shuffle(range(36).map(function (number, index) {
        return makeCell(number, plainColor, index);
      }));

      tasks = choose(
        grid,
        targetsPerRound,
        'standard-number',
        function (cell) { return cell.number; }
      ).map(function (cell) {
        return {
          number: cell.number,
          color: plainColor,
          useColor: false,
          wrongCount: 0,
          hinted: false
        };
      });
    }

    function buildStandardColorRound() {
      const cells = [];

      range(18).forEach(function (number) {
        const pairColors = host.shuffle(colors).slice(0, 2);
        pairColors.forEach(function (color, colorIndex) {
          cells.push(makeCell(number, color, colorIndex));
        });
      });

      grid = host.shuffle(cells);
      tasks = choose(
        cells,
        targetsPerRound,
        'standard-color',
        function (cell) { return cell.number + ':' + cell.color.key; }
      ).map(function (cell) {
        return {
          number: cell.number,
          color: cell.color,
          useColor: true,
          wrongCount: 0,
          hinted: false
        };
      });
    }

    function buildStandardMixedRound() {
      const uniqueCells = range(24).map(function (number, index) {
        return makeCell(number, colors[index % colors.length], index);
      });
      const duplicateCells = [];

      range(6).forEach(function (offset) {
        const number = offset + 25;
        const pairColors = host.shuffle(colors).slice(0, 2);
        pairColors.forEach(function (color, colorIndex) {
          duplicateCells.push(makeCell(number, color, colorIndex));
        });
      });

      grid = host.shuffle(uniqueCells.concat(duplicateCells));

      const numberTasks = choose(
        uniqueCells,
        2,
        'standard-mixed-number',
        function (cell) { return cell.number; }
      );
      const colorTasks = choose(
        duplicateCells,
        2,
        'standard-mixed-color',
        function (cell) { return cell.number + ':' + cell.color.key; }
      );

      tasks = [
        {
          number: numberTasks[0].number,
          color: numberTasks[0].color,
          useColor: false,
          wrongCount: 0,
          hinted: false
        },
        {
          number: colorTasks[0].number,
          color: colorTasks[0].color,
          useColor: true,
          wrongCount: 0,
          hinted: false
        },
        {
          number: numberTasks[1].number,
          color: numberTasks[1].color,
          useColor: false,
          wrongCount: 0,
          hinted: false
        },
        {
          number: colorTasks[1].number,
          color: colorTasks[1].color,
          useColor: true,
          wrongCount: 0,
          hinted: false
        }
      ];
    }

    function buildAdvancedRound() {
      if (round === 0) {
        grid = host.shuffle(range(36).map(function (number, index) {
          return makeCell(number, plainColor, index);
        }));
        sequence = choose(
          grid,
          sequenceLengths[round],
          'advanced-sequence-round-0',
          function (cell) { return cell.number; }
        ).map(function (cell) {
          return {
            number: cell.number,
            color: plainColor,
            useColor: false
          };
        });
      } else {
        const uniqueCells = range(24).map(function (number, index) {
          return makeCell(number, plainColor, index);
        });
        const duplicateCells = makeColorPairCells(
          range(6).map(function (number) { return number + 24; })
        );
        const colorTargetCount = round === 1 ? 1 : 2;
        const numberTargetCount = sequenceLengths[round] - colorTargetCount;
        const numberTargets = choose(
          uniqueCells,
          numberTargetCount,
          'advanced-number-round-' + round,
          function (cell) { return cell.number; }
        ).map(function (cell) {
          return {
            number: cell.number,
            color: plainColor,
            useColor: false
          };
        });
        const colorTargets = chooseDistinctNumberCells(
          duplicateCells,
          colorTargetCount,
          'advanced-color-round-' + round
        ).map(function (cell) {
          return {
            number: cell.number,
            color: cell.color,
            useColor: true
          };
        });

        grid = host.shuffle(uniqueCells.concat(duplicateCells));
        sequence = host.shuffle(numberTargets.concat(colorTargets));
      }
      sequencePosition = 0;
      sequenceVisible = true;
      tasks = [];
    }

    function buildRound() {
      if (level === 'easy') {
        buildEasyRound();
        return;
      }

      if (level === 'hard') {
        buildAdvancedRound();
        return;
      }

      if (round === 0) {
        buildStandardNumberRound();
      } else if (round === 1) {
        buildStandardColorRound();
      } else {
        buildStandardMixedRound();
      }
    }

    function currentTask() {
      return tasks[taskIndex] || null;
    }

    function taskMatchesCell(task, cell) {
      if (!task || task.number !== cell.number) return false;
      return !task.useColor || task.color.key === cell.color.key;
    }

    function spokenPrompt() {
      if (level === 'hard') {
        return '請依序找到，' + sequence.map(function (target) {
          return target.useColor
            ? target.color.name + '的' + target.number
            : String(target.number);
        }).join('，');
      }

      const task = currentTask();
      if (!task) return '';
      return task.useColor
        ? '請找到' + task.color.name + '的' + task.number
        : '請找到數字' + task.number;
    }

    function readPrompt() {
      const text = spokenPrompt();
      if (!text) return;
      readAloudCount += 1;
      roundReadAloud += 1;
      host.speak(text);
    }

    function clearSequenceTimer() {
      if (sequenceTimer) {
        clearSessionTimeout(sequenceTimer);
        sequenceTimer = null;
      }
    }

    function scheduleSequenceHide() {
      clearSequenceTimer();
      if (level !== 'hard' || phase !== 'playing') return;

      sequenceTimer = sessionTimeout(function () {
        sequenceVisible = false;
        sequenceTimer = null;
        render();
      }, 5000);
    }

    function showSequenceHint() {
      if (level !== 'hard' || phase !== 'playing') return;
      hints += 1;
      roundHints += 1;
      sequenceVisible = true;
      statusText = '順序會再顯示5秒。';
      render();
      scheduleSequenceHide();
    }

    function showPositionHint() {
      const task = currentTask();
      if (!task || task.hinted || phase !== 'playing') return;

      const answerIndex = grid.findIndex(function (cell) {
        return taskMatchesCell(task, cell);
      });
      const rowNumber = Math.floor(answerIndex / gridSize) + 1;
      task.hinted = true;
      hints += 1;
      roundHints += 1;
      statusText = task.useColor
        ? '提示：請同時留意數字、顏色和框線；答案在第' + rowNumber + '排。'
        : '提示：答案在第' + rowNumber + '排。';
      render();
    }

    function scoreValue() {
      const attempts = correct + wrong;
      const accuracy = attempts ? correct / attempts * 100 : 0;
      const completion = correct / totalRequired * 100;
      return Math.max(
        0,
        Math.min(100, Math.round(accuracy * 0.7 + completion * 0.3 - hints * 3))
      );
    }

    function completionValue() {
      return Math.max(0, Math.min(100, Math.round(correct / totalRequired * 100)));
    }

    function recordRound() {
      const result = {
        round: round + 1,
        level: context.level,
        gridSize: gridSize + 'x' + gridSize,
        correctCount: roundCorrect,
        wrongCount: roundWrong,
        hintCount: roundHints,
        readAloudCount: roundReadAloud,
        durationSeconds: Math.max(1, Math.round((Date.now() - roundStartedAt) / 1000))
      };

      if (level === 'hard') {
        result.mode = round === 0
          ? '順序搜尋'
          : (round === 1 ? '順序搜尋（1個顏色目標）' : '順序搜尋（2個顏色目標）');
        result.targetSequence = sequence.map(function (target) {
          return {
            number: target.number,
            color: target.useColor ? target.color.name : ''
          };
        });
        result.colorTargetCount = sequence.filter(function (target) {
          return target.useColor;
        }).length;
        result.completedSteps = sequencePosition;
      } else {
        result.mode = level === 'easy'
          ? (round === 2 ? '顏色數字搜尋' : '單一數字搜尋')
          : (round === 0 ? '數字搜尋' : round === 1 ? '顏色數字搜尋' : '混合搜尋');
        result.targets = tasks.map(function (task) {
          return {
            number: task.number,
            color: task.useColor ? task.color.name : '',
            wrongCount: task.wrongCount,
            usedHint: task.hinted
          };
        });
      }

      roundResults.push(result);
    }

    function completeRound(message) {
      clearSequenceTimer();
      phase = 'roundDone';
      statusText = message || '本輪完成！請休息一下。';
      recordRound();
      render();
    }

    function flashWrongCell(cellId) {
      wrongCellId = cellId;
      if (wrongFlashTimer) clearSessionTimeout(wrongFlashTimer);
      wrongFlashTimer = sessionTimeout(function () {
        wrongCellId = '';
        wrongFlashTimer = null;
        render();
      }, 750);
    }

    function handleStandardCell(cell) {
      const task = currentTask();

      if (!taskMatchesCell(task, cell)) {
        wrong += 1;
        roundWrong += 1;
        task.wrongCount += 1;
        statusText = '再找找看，可以使用提示。';
        flashWrongCell(cell.id);
        render();
        return;
      }

      correct += 1;
      roundCorrect += 1;
      foundCellIds.add(cell.id);

      if (taskIndex >= tasks.length - 1) {
        completeRound('第' + (round + 1) + '輪完成！請休息一下。');
        return;
      }

      phase = 'questionDone';
      statusText = '答對了！請按下一題。';
      render();
    }

    function handleAdvancedCell(cell) {
      const expectedTarget = sequence[sequencePosition];

      if (!taskMatchesCell(expectedTarget, cell)) {
        wrong += 1;
        roundWrong += 1;
        statusText = expectedTarget.useColor
          ? '順序或顏色不對，再試一次。'
          : '順序不對，再試一次。';
        flashWrongCell(cell.id);
        render();
        return;
      }

      correct += 1;
      roundCorrect += 1;
      sequencePosition += 1;
      foundCellIds.add(cell.id);

      if (sequencePosition >= sequence.length) {
        completeRound('順序完成！請休息一下。');
        return;
      }

      statusText = '正確，請繼續找下一個數字。';
      render();
    }

    function handleCell(cell) {
      if (phase !== 'playing' || foundCellIds.has(cell.id)) return;
      if (level === 'hard') {
        handleAdvancedCell(cell);
      } else {
        handleStandardCell(cell);
      }
    }

    function renderTarget() {
      const target = document.createElement('div');
      target.className = 'wm-game__number-target';

      if (level === 'hard') {
        const label = document.createElement('div');
        label.textContent = sequenceVisible
          ? '請依照箭頭順序點選；有標示顏色時需符合顏色'
          : '請依照剛才的順序繼續點選';
        target.appendChild(label);

        if (sequenceVisible) {
          const sequenceBox = document.createElement('div');
          sequenceBox.className = 'wm-game__number-sequence';
          sequence.forEach(function (sequenceTarget, index) {
            const item = document.createElement('span');
            item.textContent = sequenceTarget.useColor
              ? sequenceTarget.color.name + ' ' + sequenceTarget.number
              : sequenceTarget.number;
            item.style.setProperty(
              '--number-color',
              sequenceTarget.useColor ? sequenceTarget.color.value : plainColor.value
            );
            item.style.setProperty(
              '--number-border-style',
              sequenceTarget.useColor ? sequenceTarget.color.borderStyle : plainColor.borderStyle
            );
            item.setAttribute(
              'aria-label',
              (sequenceTarget.useColor ? sequenceTarget.color.name + '的' : '數字') + sequenceTarget.number
            );
            sequenceBox.appendChild(item);
            if (index < sequence.length - 1) {
              const arrow = document.createElement('b');
              arrow.className = 'wm-game__sequence-arrow';
              arrow.setAttribute('aria-hidden', 'true');
              arrow.textContent = '→';
              sequenceBox.appendChild(arrow);
            }
          });
          target.appendChild(sequenceBox);
        }
        return target;
      }

      const task = currentTask();
      target.appendChild(document.createTextNode(
        task && task.useColor ? '請找到' + task.color.name + '的' : '請找到數字'
      ));

      if (task) {
        const number = document.createElement('strong');
        number.textContent = task.number;
        number.style.setProperty('--number-color', task.useColor ? task.color.value : plainColor.value);
        number.style.setProperty(
          '--number-border-style',
          task.useColor ? task.color.borderStyle : plainColor.borderStyle
        );
        target.appendChild(number);
      }
      return target;
    }

    function renderBoard() {
      const board = document.createElement('div');
      board.className = 'wm-game__number-board';
      board.style.setProperty('--columns', gridSize);

      grid.forEach(function (cell) {
        const button = host.makeButton(
          String(cell.number),
          'wm-game__number-cell',
          function () { handleCell(cell); }
        );
        button.style.setProperty('--number-color', cell.color.value);
        button.style.setProperty('--number-border-style', cell.color.borderStyle);
        button.setAttribute(
          'aria-label',
          (cell.color.name ? cell.color.name : '') + '數字' + cell.number
        );
        if (foundCellIds.has(cell.id)) button.classList.add('is-found');
        if (wrongCellId === cell.id) button.classList.add('is-wrong');
        button.disabled = phase !== 'playing' || foundCellIds.has(cell.id);
        board.appendChild(button);
      });

      return board;
    }

    function renderActions() {
      const actions = document.createElement('div');
      actions.className = 'wm-game__actions';

      if (phase === 'playing') {
        actions.appendChild(host.makeButton(
          '朗讀題目',
          'wm-game__secondary',
          readPrompt
        ));

        if (level === 'hard') {
          actions.appendChild(host.makeButton(
            '再次顯示順序',
            'wm-game__hint',
            showSequenceHint
          ));
        } else {
          const hintButton = host.makeButton(
            currentTask() && currentTask().hinted ? '已顯示提示' : '給我提示',
            'wm-game__hint',
            showPositionHint
          );
          hintButton.disabled = Boolean(currentTask() && currentTask().hinted);
          actions.appendChild(hintButton);
        }
      }

      if (phase === 'questionDone') {
        actions.appendChild(host.makeButton('下一題', '', advanceQuestion));
      }

      if (phase === 'roundDone') {
        actions.appendChild(host.makeButton(
          round < totalRounds - 1 ? '前往下一輪' : '完成遊戲',
          '',
          advanceRound
        ));
      }

      return actions;
    }

    function render() {
      const roundTargetCount = level === 'hard'
        ? sequence.length
        : tasks.length;
      const roundProgress = level === 'hard'
        ? sequencePosition
        : Math.min(taskIndex + (phase === 'questionDone' || phase === 'roundDone' ? 1 : 0), roundTargetCount);

      ui.setStats([
        '第' + (round + 1) + '／' + totalRounds + '輪',
        '本輪進度：' + roundProgress + '／' + roundTargetCount,
        '答錯：' + wrong,
        '提示：' + hints
      ]);
      ui.stage.textContent = '';
      ui.stage.appendChild(renderTarget());
      ui.stage.appendChild(renderBoard());

      const feedback = document.createElement('div');
      feedback.className = 'wm-game__feedback';
      feedback.textContent = statusText;
      ui.stage.appendChild(feedback);
      ui.stage.appendChild(renderActions());
    }

    function advanceQuestion() {
      if (phase !== 'questionDone') return;
      taskIndex += 1;
      phase = 'playing';
      statusText = '';
      wrongCellId = '';
      render();
    }

    function finishGame() {
      host.complete({
        score: scoreValue(),
        completion: completionValue(),
        correctCount: correct,
        wrongCount: wrong,
        hintCount: hints,
        details: {
          totalRounds: totalRounds,
          completedRounds: roundResults.length,
          gridSize: gridSize + 'x' + gridSize,
          totalTargets: totalRequired,
          readAloudCount: readAloudCount,
          timeAffectsScore: false,
          scoreFormula: '準確率70%＋完成度30%－每次提示3分',
          roundResults: roundResults
        }
      });
    }

    function advanceRound() {
      if (phase !== 'roundDone') return;
      if (round >= totalRounds - 1) {
        finishGame();
        return;
      }

      round += 1;
      prepareRound();
    }

    function prepareRound() {
      clearSequenceTimer();
      if (wrongFlashTimer) {
        clearSessionTimeout(wrongFlashTimer);
        wrongFlashTimer = null;
      }
      taskIndex = 0;
      sequencePosition = 0;
      phase = 'playing';
      statusText = '第' + (round + 1) + '輪開始。';
      roundCorrect = 0;
      roundWrong = 0;
      roundHints = 0;
      roundReadAloud = 0;
      roundStartedAt = Date.now();
      wrongCellId = '';
      foundCellIds = new Set();
      buildRound();
      render();
      if (level === 'hard') scheduleSequenceHide();
    }

    prepareRound();

    return {
      destroy: function () {
        clearSequenceTimer();
        if (wrongFlashTimer) clearSessionTimeout(wrongFlashTimer);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      },
      getProgress: function () {
        return {
          score: scoreValue(),
          completion: completionValue(),
          correctCount: correct,
          wrongCount: wrong,
          hintCount: hints,
          details: {
            totalRounds: totalRounds,
            completedRounds: roundResults.length,
            currentRound: round + 1,
            currentRoundProgress: level === 'hard'
              ? sequencePosition
              : taskIndex + (phase === 'questionDone' || phase === 'roundDone' ? 1 : 0),
            currentRoundTargetCount: level === 'hard' ? sequence.length : tasks.length,
            totalTargets: totalRequired,
            readAloudCount: readAloudCount,
            roundResults: roundResults
          }
        };
      }
    };
  });

  register('numberPlacement', function (container, context, host) {
    const level = host.levelKey(context.level);
    const settings = {
      easy: { sizes: [3, 5, 5], counts: [8, 20, 20] },
      medium: { sizes: [5, 7, 7], counts: [20, 35, 35] },
      hard: { sizes: [7, 9, 9], counts: [35, 35, 35] }
    }[level];
    // 依使用者指定的固定次數，避免較大底盤增加額外操作負擔。
    const totalRounds = settings.counts.length;
    const totalTargets = settings.counts.reduce(function (sum, count) { return sum + count; }, 0);
    let boardSize = settings.sizes[0];
    let maximum = boardSize * boardSize;
    let pool = [];
    let boardNumbers = [];
    let numberPositions = new Map();
    const roundResults = [];
    let round = 0;
    let correct = 0;
    let wrong = 0;
    let hints = 0;
    let readAloudCount = 0;
    let roundStartedAt = Date.now();
    let tasks = [];
    let taskIndex = 0;
    let phase = 'draw';
    let current = null;
    let lastPlaced = null;
    let wrongCell = null;
    let statusText = '';
    let destroyed = false;
    let completed = false;
    let filled = new Set();
    const ui = host.createShell(container, '數字對位', context, { cancel: host.cancel });

    function completionValue() {
      return Math.round(correct / totalTargets * 100);
    }

    function scoreValue() {
      // 以整次活動的題數為分母，未完成的卡片不計分；語音不扣分。
      return Math.max(0, Math.min(100, Math.round((correct - wrong * .5 - hints * .25) / totalTargets * 100)));
    }

    function currentRoundResult() {
      return {
        round: round + 1,
        numberRange: '1–' + maximum,
        gridSize: boardSize + 'x' + boardSize,
        columns: boardSize,
        boardOrder: round === 2 ? '隨機排列' : '由左至右、由上至下',
        boardNumbers: boardNumbers.slice(),
        targetCount: settings.counts[round],
        placedCount: tasks.filter(function (task) { return task.placed; }).length,
        completed: phase === 'roundDone',
        durationSeconds: Math.max(0, Math.round((Date.now() - roundStartedAt) / 1000)),
        tasks: tasks.map(function (task) {
          return {
            number: task.number,
            drawn: task.drawn,
            placed: task.placed,
            wrongCount: task.wrongCount,
            usedHint: task.hinted,
            readAloudCount: task.readAloudCount
          };
        })
      };
    }

    function resultDetails() {
      return {
        boardOrder: '第一、二輪依序排列；第三輪隨機排列',
        cellNumbersVisible: true,
        gridSizes: settings.sizes.map(function (size) { return size + 'x' + size; }),
        numberRanges: settings.sizes.map(function (size) { return '1–' + size * size; }),
        roundTargetCounts: settings.counts.slice(),
        drawCountRule: '依難度固定次數：入門8/20/20、標準20/35/35、進階35/35/35',
        totalRounds: totalRounds,
        completedRounds: roundResults.length,
        totalTargets: totalTargets,
        placedCount: correct,
        readAloudCount: readAloudCount,
        timeAffectsScore: false,
        scoreFormula: '（放對張數－放錯次數×0.5－提示次數×0.25）÷總張數×100，最低0分',
        roundResults: roundResults.slice(),
        currentRound: round + 1,
        currentRoundProgress: taskIndex,
        currentRoundResult: phase === 'roundDone' ? null : currentRoundResult()
      };
    }

    function progress() {
      return {
        score: scoreValue(),
        completion: completionValue(),
        correctCount: correct,
        wrongCount: wrong,
        hintCount: hints,
        completed: completed,
        details: resultDetails()
      };
    }

    function focusControl(key) {
      const button = ui.stage.querySelector('[data-placement-control="' + key + '"]');
      if (button) button.focus({ preventScroll: true });
    }

    function prepareRound() {
      boardSize = settings.sizes[round];
      maximum = boardSize * boardSize;

      ui.stage.appendChild(node('p', 'wm-drums__footnote', isPractice ? '這裡可以一直練習，準備好再開始正式活動。'

        pad.appendChild(node('span', 'wm-drums__hand', '✋'));

        pad.appendChild(node('small', '', side === 'left' ? '左手拍這邊' : '右手拍這邊'));

      actions.appendChild(button('朗讀提示', readPrompt, true)); actions.appendChild(button('休息一下', pause, true));
      const sound = button('鼓聲：' + (soundOn ? '開' : '關'), function () { soundOn = !soundOn; initAudio(); sound.textContent = '鼓聲：' + (soundOn ? '開' : '關'); }, true);
      actions.appendChild(sound);

        intro.appendChild(node('p', 'wm-drums__notice', '平板平放在桌上，坐穩、雙腳有支撐。用左手拍左鼓、右手拍右鼓，不需大力敲。'));
        intro.appendChild(node('p', '', '共 3 輪，每輪 ' + config.count + ' 拍。先自由練習，再正式開始；不限時間，每小組和每輪之間都可以休息。'));
        const modes = node('div', 'wm-drums__modes');
        modes.appendChild(button('雙手版｜先練習', function () { chooseMode('twoHands'); }));
        modes.appendChild(button('單手／桌機版｜先練習', function () { chooseMode('sequential'); }, true));
        intro.appendChild(modes); intro.appendChild(node('p', 'wm-drums__footnote', '雙手提示時，雙手版須讓兩個鼓面同時被按住；可先按住一邊，再拍另一邊，不要求瞬間同步。單手／桌機版可依序點兩邊，紀錄會區分模式。'));
        ui.stage.appendChild(intro); return;
      }

        ui.stage.appendChild(node('h4', 'wm-drums__prompt', phase === 'roundDone' ? '這一輪完成了！' : '這一組拍完了！'));
        ui.stage.appendChild(node('p', 'wm-drums__feedback', '先放鬆雙手，準備好再繼續。'));
        ui.stage.appendChild(button(phase === 'groupDone' ? '準備好了，下一組' : round < 2 ? '前往下一關' : '完成活動，查看紀錄', phase === 'groupDone' ? advanceGroup : advanceRound));
        return;

        ui.stage.appendChild(node('h4', 'wm-drums__prompt', '休息一下，放鬆雙手'));
        ui.stage.appendChild(node('p', 'wm-drums__feedback', '已完成的拍數會保留，準備好再繼續。'));

          practiceCount: practiceCount, practiceCountsInScore: false, activeSeconds: Math.round(seconds),

          scoreMeaning: '已完成提示÷總提示×100；雙手提示算一拍，失誤及速度不扣完成分數',
          compareRule: '雙手版、依序版與混合模式分開觀察，難度與協助程度一併記錄',
